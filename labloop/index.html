<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabLoop · Lab Resource Manager</title>
<meta name="description" content="LabLoop demo: QR based inventory, borrowing and maintenance for school and college laboratories.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --brand:#1d4ed8;--brand2:#0ea5e9;--brandSoft:#e8efff;
  --ok:#059669;--okSoft:#d1fae5;--warn:#d97706;--warnSoft:#fef3c7;--bad:#dc2626;--badSoft:#fee2e2;
  --c1:#1d4ed8;--c2:#0891b2;--c3:#c2410c;--c4:#7c3aed;--c5:#475569;
  --r:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
.demo{background:#0f172a;color:#cbd5e1;font-size:12.5px;padding:8px 16px;text-align:center}
.demo b{color:#fff}
.demo button{background:none;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer;font-size:12px}
.app{display:flex;min-height:calc(100vh - 36px)}
.side{width:236px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#334155;font-weight:600;margin-bottom:2px}
.nav a:hover{background:#f1f5f9}
.nav a.on{background:var(--brandSoft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.inst{margin-top:auto;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.inst b{display:block;color:var(--ink);font-size:13px}
main{flex:1;min-width:0;padding:26px 30px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cbd5e1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#1e40af}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-.5px}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:600}
.stat .t{font-size:12px;margin-top:4px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.cat{border-radius:12px;padding:14px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat .dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;margin-bottom:8px}
.cat b{display:block;font-size:20px}
.cat span{color:var(--muted);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab em{font-style:normal;opacity:.6;margin-left:4px}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbff}
.id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.nm{font-weight:600;cursor:pointer}
.nm:hover{color:var(--brand)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-ok{background:var(--okSoft);color:var(--ok)}
.p-warn{background:var(--warnSoft);color:var(--warn)}
.p-bad{background:var(--badSoft);color:var(--bad)}
.p-info{background:var(--brandSoft);color:var(--brand)}
.p-mut{background:#f1f5f9;color:#475569}
.empty{padding:30px;text-align:center;color:var(--muted)}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.list .li:last-child{border-bottom:0}
.list .li small{color:var(--muted);display:block;font-size:12px}
.bars .b{margin-bottom:11px}
.bars .bl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px}
.bars .bt{height:9px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.bars .bf{height:100%;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h2{font-size:18px;margin-bottom:4px}
.mbox .x{float:right;border:0;background:#f1f5f9;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.form label{font-size:12px;font-weight:700;color:#475569;display:flex;flex-direction:column;gap:4px}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-weight:500}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--brandSoft);border-color:var(--brand)}
.hint{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.detail{display:grid;grid-template-columns:1fr 150px;gap:18px;margin:16px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.qrbox{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.qrbox canvas,.qrbox img{width:100%!important;height:auto!important}
.qrbox .id{margin-top:6px}
.hist{border-left:2px solid var(--line);padding-left:14px;margin-top:8px}
.hist div{position:relative;font-size:12.5px;padding:4px 0}
.hist div:before{content:'';position:absolute;left:-19px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.hist small{color:var(--muted)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.lbl{border:1.5px dashed #94a3b8;border-radius:10px;padding:12px;text-align:center;background:#fff}
.lbl .q{width:110px;height:110px;margin:0 auto 6px}
.lbl .q img,.lbl .q canvas{width:110px!important;height:110px!important}
.lbl b{display:block;font-size:13px;line-height:1.25}
.lbl .brand{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:4px}
.notice{border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;border:1px solid}
.notice.info{background:#f0f7ff;border-color:#bfdbfe;color:#1e3a8a}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.feat li{margin:4px 0 4px 18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;transition:.25s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0)}
.mobnav{display:none}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .side{display:none}
  main{padding:18px 16px 96px}
  .g2,.split,.detail{grid-template-columns:1fr}
  .cats{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .detail .qrbox{max-width:170px}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .mobnav a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--muted);gap:2px;padding:4px 6px}
  .mobnav a.on{color:var(--brand)}
  .mobnav svg{width:20px;height:20px}
}
@media print{
  .demo,.side,.top .row,.mobnav,.noprint{display:none!important}
  main{padding:0}body{background:#fff}
  .lbl{break-inside:avoid}
}
</style>
</head>
<body>
<div class="demo"><b>Demo version.</b> Everything you add is saved only in this browser, on this device. <button onclick="resetDemo()">Reset sample data</button></div>
<div class="app">
  <aside class="side">
    <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i><div>LabLoop<small>Lab Resource Manager</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="inst"><b id="instName"></b><span id="instSub"></span></div>
  </aside>
  <main id="main"></main>
</div>
<nav class="mobnav" id="mobnav"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const CATS=[
  {k:'EQP',name:'Equipments',color:'var(--c1)'},
  {k:'CON',name:'Consumables',color:'var(--c2)'},
  {k:'CHM',name:'Chemicals',color:'var(--c3)'},
  {k:'STA',name:'Stationery',color:'var(--c4)'},
  {k:'OTH',name:'Others',color:'var(--c5)'}
];
const LABS=['Physics Lab','Electronics Lab','Chemistry Lab','Biology Lab','Computer Lab','Materials Lab'];
const CONDS=['Working','Needs repair','Under maintenance','Damaged','Retired'];
const ICONS={
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  inv:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  loan:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  mnt:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  qr:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3zM14 20h2M20 14v2"/>',
  rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const VIEWS=[['dash','Dashboard'],['inv','Inventory'],['loan','Borrowing'],['mnt','Maintenance'],['qr','QR Labels'],['rep','Reports']];
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

let S, view='dash', invCat='ALL', invQ='', loanF='out';
const KEY='labloop_demo_v1';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=k=>CATS.find(c=>c.k===k);
const item=id=>S.items.find(i=>i.id===id);

function seed(){
  const t=today();
  const items=[
    ['EQP','Digital Multimeter','Physics Lab','Room 102',8,'nos',0,'Working','DM-8821','2023-06-12'],
    ['EQP','Cathode Ray Oscilloscope 20 MHz','Electronics Lab','Room 204',4,'nos',0,'Working','CRO-2040','2021-08-03'],
    ['EQP','Spectrometer with Prism','Physics Lab','Optics Room',3,'nos',0,'Needs repair','SP-1190','2018-01-20'],
    ['EQP','Function Generator','Electronics Lab','Room 204',5,'nos',0,'Working','FG-5512','2022-02-14'],
    ['EQP','Analytical Balance 0.1 mg','Chemistry Lab','Weighing Room',2,'nos',0,'Working','AB-220','2020-11-02'],
    ['EQP','Travelling Microscope','Physics Lab','Room 101',4,'nos',0,'Under maintenance','TM-330','2019-07-15'],
    ['EQP','Regulated DC Power Supply','Electronics Lab','Room 204',10,'nos',0,'Working','PS-3005','2022-02-14'],
    ['CON','Breadboard','Electronics Lab','Store Shelf B',40,'nos',15,'Working','',''],
    ['CON','Jumper Wires (pack of 40)','Electronics Lab','Store Shelf B',6,'packs',10,'Working','',''],
    ['CON','Filter Paper Whatman No. 1','Chemistry Lab','Cabinet 3',3,'boxes',5,'Working','',''],
    ['CON','Test Tubes 15 ml','Chemistry Lab','Cabinet 1',180,'nos',100,'Working','',''],
    ['CON','Resistor Kit','Electronics Lab','Store Shelf A',12,'kits',5,'Working','',''],
    ['CHM','Sodium Hydroxide pellets','Chemistry Lab','Chemical Store',2.5,'kg',1,'Working','','2025-04-10'],
    ['CHM','Hydrochloric Acid 35%','Chemistry Lab','Acid Cabinet',1.5,'L',2,'Working','','2025-06-01'],
    ['CHM','Silver Nitrate','Chemistry Lab','Locked Cabinet',100,'g',50,'Working','','2024-12-01'],
    ['CHM','Ethanol 99%','Biology Lab','Flammables Cabinet',4,'L',2,'Working','','2025-08-20'],
    ['STA','Record Notebooks','Physics Lab','Office',35,'nos',20,'Working','',''],
    ['STA','Graph Sheets','Physics Lab','Office',120,'sheets',200,'Working','',''],
    ['STA','Stock Register','Chemistry Lab','Office',2,'nos',1,'Working','',''],
    ['OTH','First Aid Box','Chemistry Lab','Entrance',2,'nos',1,'Working','',''],
    ['OTH','Fire Extinguisher CO2','Physics Lab','Corridor',3,'nos',0,'Working','FE-77','2022-09-01'],
    ['OTH','Lab Coats','Biology Lab','Locker',18,'nos',10,'Working','','']
  ];
  const cnt={};
  const it=items.map(r=>{cnt[r[0]]=(cnt[r[0]]||0)+1;return{id:`${r[0]}-${String(cnt[r[0]]).padStart(3,'0')}`,cat:r[0],name:r[1],lab:r[2],location:r[3],qty:r[4],unit:r[5],min:r[6],condition:r[7],serial:r[8],purchased:r[9],notes:'',expiry:r[0]==='CHM'?addDays(t,[200,25,-10,400][cnt.CHM-1]):'',hazard:r[0]==='CHM'?['Corrosive','Corrosive','Oxidiser, toxic','Flammable'][cnt.CHM-1]:''}});
  const loans=[
    {id:'L1',itemId:'EQP-002',qty:1,borrower:'Anjali Menon',borrowerLab:'Physics Lab',purpose:'Lissajous figures practical',out:addDays(t,-9),due:addDays(t,-2),returned:''},
    {id:'L2',itemId:'EQP-001',qty:2,borrower:'Rahul K',borrowerLab:'Electronics Lab',purpose:'Project work',out:addDays(t,-3),due:addDays(t,4),returned:''},
    {id:'L3',itemId:'CON-008',qty:10,borrower:'Dr. Suresh Nair',borrowerLab:'Computer Lab',purpose:'IoT workshop',out:addDays(t,-2),due:addDays(t,5),returned:''},
    {id:'L4',itemId:'EQP-004',qty:1,borrower:'Fathima Rinsha',borrowerLab:'Physics Lab',purpose:'Resonance experiment',out:addDays(t,-14),due:addDays(t,-7),returned:addDays(t,-8)},
    {id:'L5',itemId:'EQP-005',qty:1,borrower:'Arun Das',borrowerLab:'Biology Lab',purpose:'Sample weighing',out:addDays(t,-6),due:addDays(t,-1),returned:''}
  ];
  const maint=[
    {id:'M1',itemId:'EQP-005',type:'Calibration',due:addDays(t,6),done:'',by:'',notes:'Annual calibration by vendor'},
    {id:'M2',itemId:'EQP-003',type:'Repair',due:addDays(t,-4),done:'',by:'',notes:'Prism table screw loose'},
    {id:'M3',itemId:'EQP-006',type:'Maintenance',due:addDays(t,2),done:'',by:'',notes:'Clean and lubricate rack'},
    {id:'M4',itemId:'OTH-002',type:'Inspection',due:addDays(t,24),done:'',by:'',notes:'Pressure check'},
    {id:'M5',itemId:'EQP-002',type:'Calibration',due:addDays(t,-40),done:addDays(t,-38),by:'Techno Services, Kozhikode',notes:'Probe compensation verified'}
  ];
  const log=[];
  it.forEach(i=>log.push({itemId:i.id,at:addDays(t,-30),text:'Imported from Excel register'}));
  loans.forEach(l=>{log.push({itemId:l.itemId,at:l.out,text:`Issued ${l.qty} to ${l.borrower} (${l.borrowerLab})`});if(l.returned)log.push({itemId:l.itemId,at:l.returned,text:`Returned by ${l.borrower}`})});
  log.push({itemId:'EQP-002',at:addDays(t,-38),text:'Calibration completed by Techno Services, Kozhikode'});
  return{inst:{name:'St. Joseph\'s College',sub:'Department of Physical Sciences'},items:it,loans,maint,log,seq:100};
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.items)S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function resetDemo(){if(!confirm('Reset to the sample data? Anything you added will be removed.'))return;S=seed();save();render();toast('Sample data restored')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function addLog(itemId,text){S.log.push({itemId,at:today(),text})}

const isLow=i=>i.min>0&&Number(i.qty)<=Number(i.min);
const isExpiring=i=>i.expiry&&i.expiry<=addDays(today(),30);
const openLoans=()=>S.loans.filter(l=>!l.returned);
const overdue=l=>!l.returned&&l.due<today();
const openMaint=()=>S.maint.filter(m=>!m.done);
const condPill=c=>`<span class="pill ${c==='Working'?'p-ok':c==='Retired'?'p-mut':c==='Damaged'?'p-bad':'p-warn'}">${esc(c)}</span>`;
const lent=id=>openLoans().filter(l=>l.itemId===id).reduce((a,l)=>a+Number(l.qty),0);

function nav(){
  const h=VIEWS.map(([k,n])=>`<a href="#${k}" class="${view===k?'on':''}">${ico(k)}${n}</a>`).join('');
  document.getElementById('nav').innerHTML=h;
  document.getElementById('mobnav').innerHTML=VIEWS.map(([k,n])=>`<a href="#${k}" class="${view===k?'on':''}">${ico(k)}${n==='QR Labels'?'Labels':n}</a>`).join('');
  document.getElementById('instName').textContent=S.inst.name;
  document.getElementById('instSub').textContent=S.inst.sub;
}
function render(){nav();const m=document.getElementById('main');m.innerHTML=({dash:vDash,inv:vInv,loan:vLoan,mnt:vMnt,qr:vQR,rep:vRep}[view]||vDash)();if(view==='qr')drawLabels();window.scrollTo(0,0)}

function vDash(){
  const low=S.items.filter(isLow),od=S.loans.filter(overdue),dueM=openMaint().filter(m=>m.due<=addDays(today(),14)).sort((a,b)=>a.due<b.due?-1:1),exp=S.items.filter(isExpiring);
  return `<div class="top"><div><h1>Good to see you</h1><div class="sub">${esc(S.inst.name)} · ${fmt(today())}</div></div>
  <div class="row"><button class="btn" onclick="loanForm()">${ico('loan')}Issue item</button><button class="btn pri" onclick="itemForm()">+ Add item</button></div></div>

const stat=(n,l,t,st)=>`<div class="card stat"><div class="l">${l}</div><div class="n">${n}</div><div class="t" style="${st}">${t||'&nbsp;'}</div></div>`;

  </tbody></table></div>`;

function vLoan(){
  const rows=S.loans.filter(l=>loanF==='all'||(loanF==='out'?!l.returned:loanF==='over'?overdue(l):!!l.returned)).sort((a,b)=>a.out<b.out?1:-1);
  const f=(k,n,c)=>`<button class="tab ${loanF===k?'on':''}" onclick="loanF='${k}';render()">${n}<em>${c}</em></button>`;
  return `<div class="top"><div><h1>Borrowing register</h1><div class="sub">Who took what, for which lab, and when it comes back</div></div><div class="row"><button class="btn" onclick="exportCSV('loans')">Export CSV</button><button class="btn pri" onclick="loanForm()">+ Issue item</button></div></div>
  <div class="tabs">${f('out','Borrowed now',openLoans().length)}${f('over','Overdue',S.loans.filter(overdue).length)}${f('back','Returned',S.loans.filter(l=>l.returned).length)}${f('all','All',S.loans.length)}</div>
  <div class="tablewrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Borrowed by</th><th>Borrowing lab</th><th>Issued</th><th>Due back</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(l=>{const i=item(l.itemId);return`<tr><td><span class="nm" onclick="showItem('${l.itemId}')">${esc(i?i.name:'Deleted item')}</span><div class="id">${l.itemId}</div></td><td>${l.qty}</td><td><b>${esc(l.borrower)}</b>${l.purpose?`<div class="sub" style="font-size:12px">${esc(l.purpose)}</div>`:''}</td><td>${esc(l.borrowerLab)}</td><td>${fmt(l.out)}</td><td>${fmt(l.due)}</td><td>${l.returned?`<span class="pill p-ok">Returned ${fmt(l.returned)}</span>`:overdue(l)?'<span class="pill p-bad">Overdue</span>':'<span class="pill p-info">With borrower</span>'}</td><td style="text-align:right">${l.returned?'':`<button class="btn sm okb" onclick="returnLoan('${l.id}')">Returned</button>`}</td></tr>`}).join(''):`<tr><td colspan="8" class="empty">No records here</td></tr>`}
  </tbody></table></div>`;
}

function vMnt(){
  const open=openMaint().sort((a,b)=>a.due<b.due?-1:1),done=S.maint.filter(m=>m.done).sort((a,b)=>a.done<b.done?1:-1);
  const tr=m=>{const i=item(m.itemId);return`<tr><td><span class="nm" onclick="showItem('${m.itemId}')">${esc(i?i.name:'Deleted item')}</span><div class="id">${m.itemId}</div></td><td><span class="pill p-mut">${esc(m.type)}</span></td><td>${m.done?fmt(m.done):`<span class="pill ${m.due<today()?'p-bad':m.due<=addDays(today(),7)?'p-warn':'p-info'}">${fmt(m.due)}</span>`}</td><td>${esc(m.done?m.by:m.notes)}</td><td style="text-align:right">${m.done?'':`<button class="btn sm okb" onclick="doneForm('${m.id}')">Complete</button>`}</td></tr>`};
  return `<div class="top"><div><h1>Maintenance and calibration</h1><div class="sub">Schedule service, record who did it</div></div><div class="row"><button class="btn" onclick="exportCSV('maint')">Export CSV</button><button class="btn pri" onclick="maintForm()">+ Schedule task</button></div></div>
  <div class="card" style="margin-bottom:16px;padding:0"><div style="padding:16px 18px 6px"><h3>Open tasks</h3></div><div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Item</th><th>Type</th><th>Due</th><th>Notes</th><th></th></tr></thead><tbody>${open.length?open.map(tr).join(''):'<tr><td colspan="5" class="empty">No open tasks</td></tr>'}</tbody></table></div></div>
  <div class="card" style="padding:0"><div style="padding:16px 18px 6px"><h3>Completed</h3></div><div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Item</th><th>Type</th><th>Completed</th><th>Done by</th><th></th></tr></thead><tbody>${done.length?done.map(tr).join(''):'<tr><td colspan="5" class="empty">Nothing yet</td></tr>'}</tbody></table></div></div>
  <p class="sub" style="margin-top:14px">A reminder is not a calibration certificate. Keep the provider's certificate with the record.</p>`;
}

let qrCat='ALL';
function vQR(){
  return `<div class="top"><div><h1>QR labels</h1><div class="sub">Print, cut and stick one on each item. Scanning opens that item's page.</div></div><div class="row"><button class="btn pri" onclick="window.print()">Print labels</button></div></div>
  <div class="notice info noprint">In this demo a scanned label opens the item only on the device where the data was entered. With a shared database, any staff phone could scan it.</div>
  <div class="tabs noprint"><button class="tab ${qrCat==='ALL'?'on':''}" onclick="qrCat='ALL';render()">All</button>${CATS.map(c=>`<button class="tab ${qrCat===c.k?'on':''}" onclick="qrCat='${c.k}';render()">${c.name}</button>`).join('')}</div>
  <div class="labels">${S.items.filter(i=>qrCat==='ALL'||i.cat===qrCat).map(i=>`<div class="lbl"><div class="q" data-qr="${i.id}"></div><b>${esc(i.name)}</b><div class="id">${i.id}</div><div class="brand">${esc(S.inst.name)} · LabLoop</div></div>`).join('')}</div>`;
}
const itemURL=id=>location.origin+location.pathname+'#item='+id;
function makeQR(el,id,size){el.innerHTML='';if(window.QRCode)new QRCode(el,{text:itemURL(id),width:size,height:size,correctLevel:QRCode.CorrectLevel.M});else el.textContent=id}
function drawLabels(){document.querySelectorAll('[data-qr]').forEach(el=>makeQR(el,el.dataset.qr,220))}

function vRep(){
  const byCat=CATS.map(c=>[c.name,S.items.filter(i=>i.cat===c.k).length,c.color]);
  const byCond=CONDS.map(c=>[c,S.items.filter(i=>i.cat==='EQP'&&i.condition===c).length,c==='Working'?'var(--ok)':c==='Damaged'?'var(--bad)':c==='Retired'?'#94a3b8':'var(--warn)']);
  const labsB={};S.loans.forEach(l=>labsB[l.borrowerLab]=(labsB[l.borrowerLab]||0)+1);
  const byLab=Object.entries(labsB).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,'var(--brand)']);
  const itB={};S.loans.forEach(l=>itB[l.itemId]=(itB[l.itemId]||0)+1);
  const top=Object.entries(itB).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>[item(k)?item(k).name:k,v,'var(--c2)']);
  const back=S.loans.filter(l=>l.returned),onTime=back.filter(l=>l.returned<=l.due).length;
  const mDone=S.maint.filter(m=>m.done).length;
  return `<div class="top"><div><h1>Reports</h1><div class="sub">A snapshot for the head of department</div></div><div class="row"><button class="btn" onclick="exportCSV('items')">Inventory CSV</button><button class="btn" onclick="exportCSV('loans')">Borrowing CSV</button><button class="btn" onclick="exportCSV('maint')">Maintenance CSV</button><button class="btn pri" onclick="window.print()">Print report</button></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    ${stat(S.items.length,'Items on register','','')}
    ${stat(S.items.filter(i=>i.cat==='EQP'&&i.condition!=='Working').length,'Equipment not working','','')}
    ${stat(back.length?Math.round(onTime/back.length*100)+'%':'n/a','Returned on time',`${back.length} returns`,'')}
    ${stat(mDone+' / '+S.maint.length,'Maintenance tasks done','','')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>Items by category</h3>${bars(byCat)}</div>
    <div class="card"><h3>Equipment condition</h3>${bars(byCond)}</div>
    <div class="card"><h3>Borrowing by lab</h3>${byLab.length?bars(byLab):'<div class="empty">No borrowing yet</div>'}</div>
    <div class="card"><h3>Most borrowed items</h3>${top.length?bars(top):'<div class="empty">No borrowing yet</div>'}</div>
  </div>`;
}
function bars(d){const mx=Math.max(1,...d.map(x=>x[1]));return`<div class="bars">${d.map(([l,v,c])=>`<div class="b"><div class="bl"><span>${esc(l)}</span><span>${v}</span></div><div class="bt"><div class="bf" style="width:${v/mx*100}%;background:${c}"></div></div></div>`).join('')}</div>`}

/* modals */
function openModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on');if(location.hash.startsWith('#item='))history.replaceState(null,'','#'+view)}
const opt=(arr,sel)=>arr.map(a=>{const[v,n]=Array.isArray(a)?a:[a,a];return`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(n)}</option>`}).join('');
const fv=id=>document.getElementById(id).value.trim();

function itemForm(id){
  const i=id?item(id):{cat:invCat!=='ALL'?invCat:'EQP',name:'',lab:LABS[0],location:'',qty:1,unit:'nos',min:0,condition:'Working',serial:'',purchased:'',expiry:'',hazard:'',notes:''};
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>${id?'Edit '+esc(i.name):'Add an item'}</h2><div class="sub">${id?i.id:'An ID and QR label are created automatically'}</div>
  <div class="form">
    <label>Category<select id="f_cat" onchange="document.getElementById('chm').style.display=this.value==='CHM'?'contents':'none'">${opt(CATS.map(c=>[c.k,c.name]),i.cat)}</select></label>

    <label>Lab<select id="f_lab">${opt(LABS,i.lab)}</select></label>
    <label>Room or shelf<input id="f_loc" value="${esc(i.location)}" placeholder="Room 102"></label>
    <label>Quantity<input id="f_qty" type="number" step="any" min="0" value="${i.qty}"></label>
    <label>Unit<input id="f_unit" value="${esc(i.unit)}" placeholder="nos, kg, L, boxes"></label>
    <label>Reorder when at or below<input id="f_min" type="number" step="any" min="0" value="${i.min}"><span class="hint">0 means no low stock alert</span></label>
    <label>Condition<select id="f_cond">${opt(CONDS,i.condition)}</select></label>
    <label>Serial number<input id="f_serial" value="${esc(i.serial)}"></label>
    <label>Purchase date<input id="f_pur" type="date" value="${i.purchased}"></label>
    <div id="chm" style="display:${i.cat==='CHM'?'contents':'none'}">
      <label>Expiry date<input id="f_exp" type="date" value="${i.expiry||''}"></label>
      <label>Hazard<input id="f_haz" value="${esc(i.hazard||'')}" placeholder="Corrosive, flammable"></label>
    </div>
    <label class="full">Notes<textarea id="f_notes" rows="2">${esc(i.notes)}</textarea></label>
  </div>
  <div class="row" style="justify-content:space-between">${id?`<button class="btn danger" onclick="delItem('${id}')">Delete</button>`:'<span></span>'}<div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveItem('${id||''}')">Save</button></div></div>`);
  setTimeout(()=>document.getElementById('f_name').focus(),50);
}
function saveItem(id){
  const name=fv('f_name');if(!name){toast('Give the item a name');return}
  const c=fv('f_cat');
  const d={cat:c,name,lab:fv('f_lab'),location:fv('f_loc'),qty:Number(fv('f_qty'))||0,unit:fv('f_unit')||'nos',min:Number(fv('f_min'))||0,condition:fv('f_cond'),serial:fv('f_serial'),purchased:fv('f_pur'),expiry:c==='CHM'?fv('f_exp'):'',hazard:c==='CHM'?fv('f_haz'):'',notes:fv('f_notes')};
  if(id){const i=item(id);const ch=i.condition!==d.condition?` (condition: ${d.condition})`:'';Object.assign(i,d);addLog(id,'Record edited'+ch);toast('Saved')}
  else{const n=S.items.filter(x=>x.cat===c).reduce((m,x)=>Math.max(m,+x.id.split('-')[1]),0)+1;const nid=`${c}-${String(n).padStart(3,'0')}`;S.items.push({id:nid,...d});addLog(nid,'Added to register');toast(`${nid} added`)}
  save();closeModal();render();
}
function delItem(id){if(!confirm('Delete this item and its history?'))return;S.items=S.items.filter(i=>i.id!==id);S.log=S.log.filter(l=>l.itemId!==id);save();closeModal();render();toast('Deleted')}

function showItem(id){
  const i=item(id);if(!i){toast('Item not found on this device');return}
  const ls=S.loans.filter(l=>l.itemId===id&&!l.returned),ms=openMaint().filter(m=>m.itemId===id);
  const hist=S.log.filter(l=>l.itemId===id).slice().reverse().slice(0,12);
  openModal(`<button class="x" onclick="closeModal()">×</button><span class="pill" style="background:#f1f5f9;color:${cat(i.cat).color}">${cat(i.cat).name}</span><h2 style="margin-top:6px">${esc(i.name)}</h2><div class="id">${i.id}</div>
  <div class="detail"><dl class="kv">
    <dt>Lab</dt><dd>${esc(i.lab)}</dd><dt>Location</dt><dd>${esc(i.location)||'n/a'}</dd>
    <dt>Quantity</dt><dd>${i.qty} ${esc(i.unit)}${lent(id)?` (${lent(id)} borrowed)`:''} ${isLow(i)?'<span class="pill p-warn">Low</span>':''}</dd>
    <dt>Condition</dt><dd>${condPill(i.condition)}</dd>
    ${i.serial?`<dt>Serial</dt><dd>${esc(i.serial)}</dd>`:''}${i.purchased?`<dt>${i.cat==='CHM'?'Received':'Purchased'}</dt><dd>${fmt(i.purchased)}</dd>`:''}
    ${i.expiry?`<dt>Expiry</dt><dd><span class="pill ${i.expiry<today()?'p-bad':isExpiring(i)?'p-warn':'p-ok'}">${fmt(i.expiry)}</span></dd>`:''}${i.hazard?`<dt>Hazard</dt><dd style="color:var(--c3);font-weight:600">${esc(i.hazard)}</dd>`:''}
    ${i.notes?`<dt>Notes</dt><dd>${esc(i.notes)}</dd>`:''}
  </dl><div class="qrbox"><div id="dq"></div><div class="id">${i.id}</div></div></div>
  ${ls.length?`<div class="notice info"><b>Borrowed now:</b> ${ls.map(l=>`${l.qty} by ${esc(l.borrower)}, ${esc(l.borrowerLab)}, due ${fmt(l.due)}`).join('; ')}</div>`:''}
  ${ms.length?`<div class="notice" style="background:var(--warnSoft);border-color:#fde68a;color:#92400e"><b>Scheduled:</b> ${ms.map(m=>`${esc(m.type)} due ${fmt(m.due)}`).join('; ')}</div>`:''}
  <div class="row" style="margin-bottom:16px">
    <button class="btn pri" onclick="loanForm('${id}')">Issue / borrow</button>
    ${ls.length?`<button class="btn okb" onclick="returnLoan('${ls[0].id}',1)">Mark returned</button>`:''}
    <button class="btn" onclick="damageForm('${id}')">Report damage</button>
    <button class="btn" onclick="maintForm('${id}')">Schedule service</button>
    <button class="btn" onclick="itemForm('${id}')">Edit</button>
  </div>
  <h3 style="font-size:13.5px">History</h3><div class="hist">${hist.map(h=>`<div>${esc(h.text)} <small>· ${fmt(h.at)}</small></div>`).join('')||'<div>No history</div>'}</div>`);
  makeQR(document.getElementById('dq'),id,240);
}

function loanForm(id){
  const its=S.items.filter(i=>i.condition!=='Retired');
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>Issue an item</h2><div class="sub">Record who is borrowing it and for which lab</div>
  <div class="form">
    <label class="full">Item<select id="l_item">${its.map(i=>`<option value="${i.id}" ${i.id===id?'selected':''}>${i.id} · ${esc(i.name)} (${i.qty-lent(i.id)} ${esc(i.unit)} available)</option>`).join('')}</select></label>
    <label>Borrowed by<input id="l_who" placeholder="Name of student or staff"></label>
    <label>Borrowing lab or department<input id="l_lab" list="labs" placeholder="e.g. Electronics Lab"><datalist id="labs">${LABS.map(l=>`<option value="${l}">`).join('')}</datalist></label>
    <label>Quantity<input id="l_qty" type="number" min="1" value="1"></label>
    <label>Return by<input id="l_due" type="date" value="${addDays(today(),7)}"></label>
    <label class="full">Purpose<input id="l_pur" placeholder="Practical, project, workshop"></label>
  </div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveLoan()">Issue</button></div>`);
}
function saveLoan(){
  const itemId=fv('l_item'),who=fv('l_who'),lab=fv('l_lab'),qty=Number(fv('l_qty'))||1;
  if(!who||!lab){toast('Fill in who borrowed it and their lab');return}
  const i=item(itemId);if(qty>i.qty-lent(itemId)){toast(`Only ${i.qty-lent(itemId)} available`);return}
  S.loans.push({id:'L'+(++S.seq),itemId,qty,borrower:who,borrowerLab:lab,purpose:fv('l_pur'),out:today(),due:fv('l_due')||addDays(today(),7),returned:''});
  addLog(itemId,`Issued ${qty} to ${who} (${lab})`);save();closeModal();render();toast('Issued')
}
function returnLoan(lid,fromItem){const l=S.loans.find(x=>x.id===lid);l.returned=today();addLog(l.itemId,`Returned by ${l.borrower}`);save();render();toast('Marked returned');if(fromItem)showItem(l.itemId)}

function damageForm(id){
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>Report damage</h2><div class="sub">${esc(item(id).name)} · ${id}</div>
  <div class="form"><label>New condition<select id="d_cond">${opt(CONDS.slice(1),'Needs repair')}</select></label><label>Reported by<input id="d_by"></label><label class="full">What happened<textarea id="d_note" rows="3"></textarea></label>
  <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="d_sched" checked style="width:auto">Also schedule a repair in 7 days</label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="showItem('${id}')">Back</button><button class="btn pri" onclick="saveDamage('${id}')">Report</button></div>`);
}
function saveDamage(id){const i=item(id),c=fv('d_cond'),by=fv('d_by'),n=fv('d_note');i.condition=c;addLog(id,`Damage reported${by?' by '+by:''}: ${n||c}`);if(document.getElementById('d_sched').checked)S.maint.push({id:'M'+(++S.seq),itemId:id,type:'Repair',due:addDays(today(),7),done:'',by:'',notes:n});save();render();showItem(id);toast('Reported')}

function maintForm(id){
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>Schedule maintenance</h2>
  <div class="form"><label class="full">Item<select id="m_item">${S.items.filter(i=>['EQP','OTH'].includes(i.cat)).map(i=>`<option value="${i.id}" ${i.id===id?'selected':''}>${i.id} · ${esc(i.name)}</option>`).join('')}</select></label>
  <label>Type<select id="m_type">${opt(['Maintenance','Calibration','Repair','Inspection'],'Maintenance')}</select></label><label>Due date<input id="m_due" type="date" value="${addDays(today(),14)}"></label>
  <label class="full">Notes<input id="m_notes" placeholder="What needs doing"></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveMaint()">Schedule</button></div>`);
}
function saveMaint(){const itemId=fv('m_item');S.maint.push({id:'M'+(++S.seq),itemId,type:fv('m_type'),due:fv('m_due')||today(),done:'',by:'',notes:fv('m_notes')});addLog(itemId,`${fv('m_type')} scheduled for ${fmt(fv('m_due'))}`);save();closeModal();render();toast('Scheduled')}
function doneForm(mid){
  const m=S.maint.find(x=>x.id===mid);
  openModal(`<button class="x" onclick="closeModal()">×</button><h2>Complete ${esc(m.type.toLowerCase())}</h2><div class="sub">${esc(item(m.itemId)?.name||'')}</div>
  <div class="form"><label>Done on<input id="c_date" type="date" value="${today()}"></label><label>Done by<input id="c_by" placeholder="Staff name or service company"></label>
  <label>Condition after<select id="c_cond">${opt(CONDS,'Working')}</select></label><label>Certificate or job number<input id="c_ref"></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveDone('${mid}')">Mark complete</button></div>`);
}
function saveDone(mid){const m=S.maint.find(x=>x.id===mid);const by=fv('c_by');if(!by){toast('Who did it?');return}m.done=fv('c_date')||today();m.by=by+(fv('c_ref')?' · ref '+fv('c_ref'):'');const i=item(m.itemId);if(i)i.condition=fv('c_cond');addLog(m.itemId,`${m.type} completed by ${m.by}`);save();closeModal();render();toast('Completed')}

function exportCSV(kind){
  let rows;
  if(kind==='items')rows=[['ID','Category','Name','Lab','Location','Quantity','Unit','Reorder level','Condition','Serial','Purchased','Expiry','Hazard','Borrowed now']].concat(S.items.map(i=>[i.id,cat(i.cat).name,i.name,i.lab,i.location,i.qty,i.unit,i.min,i.condition,i.serial,i.purchased,i.expiry,i.hazard,lent(i.id)]));
  if(kind==='loans')rows=[['Item ID','Item','Quantity','Borrowed by','Borrowing lab','Purpose','Issued','Due','Returned','Status']].concat(S.loans.map(l=>[l.itemId,item(l.itemId)?.name||'',l.qty,l.borrower,l.borrowerLab,l.purpose,l.out,l.due,l.returned,l.returned?'Returned':overdue(l)?'Overdue':'Out']));
  if(kind==='maint')rows=[['Item ID','Item','Type','Due','Completed','Done by','Notes']].concat(S.maint.map(m=>[m.itemId,item(m.itemId)?.name||'',m.type,m.due,m.done,m.by,m.notes]));
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=`labloop_${kind}_${today()}.csv`;a.click();toast('CSV downloaded')
}

function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('item=')){const id=decodeURIComponent(h.slice(5));render();showItem(id);return}
  view=VIEWS.some(v=>v[0]===h)?h:'dash';closeModal();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',route);
load();save();route();
</script>
</body>
</html>
