<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free File Tools: Convert Files in Your Browser</title>
<meta name="description" content="Free tools that open and convert files right in your browser. No upload, no sign up. Your files never leave your device.">
<link rel="canonical" href="https://akshaycp.com/tools/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #f6f3ec; --card: #ffffff; --ink: #1b1d22; --soft: #5c6170; --line: #e2ddd1; --accent: #0a84c6;
  --c: #00a3e0; --m: #e5007e; --y: #f5c400; --k: #1b1d22; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #17191e; --card: #22252c; --ink: #eeeae1; --soft: #a3a7b3; --line: #343842; --accent: #3fb0eb; --k: #eeeae1; }
}
:root[data-theme="dark"] { --paper: #17191e; --card: #22252c; --ink: #eeeae1; --soft: #a3a7b3; --line: #343842; --accent: #3fb0eb; --k: #eeeae1; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Space Grotesk", system-ui, sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }
.dots { display: inline-flex; gap: 3px; margin-top: 24px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: var(--c); } .dots i:nth-child(2) { background: var(--m); }
.dots i:nth-child(3) { background: var(--y); } .dots i:nth-child(4) { background: var(--k); }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 16px 0 8px; letter-spacing: -0.02em; }
p.lede { color: var(--soft); font-size: 18px; margin: 0 0 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
a.tool { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; color: var(--ink); text-decoration: none; }
a.tool:hover { border-color: var(--accent); }
a.tool b { display: block; font-size: 18px; }
a.tool span { color: var(--soft); font-size: 15px; }
footer { color: var(--soft); font-size: 14px; margin-top: 40px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <span class="dots"><i></i><i></i><i></i><i></i></span>
  <h1>Free file tools</h1>
  <p class="lede">Open and convert files right in your browser. Nothing is uploaded, and there's no sign up.</p>
  <div class="grid">
    <a class="tool" href="/tools/cdr-to-pdf/"><b>CDR to PDF</b><span>Open CorelDRAW files and save them as PDF or PNG.</span></a>
  </div>
  <footer>Made by <a href="/">Akshay CP</a>.</footer>
</div>
</body>
</html>
